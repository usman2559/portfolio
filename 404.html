<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Hadi_X_Hacker</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --void:#04070a; --green:#39ff88; --cyan:#35e7ff; --text-hi:#eaf3ee; --text-low:#7c8b86; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--void); color:var(--text-hi); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"Space Grotesk",sans-serif; text-align:center; padding:2rem;
  }
  .code{ font-size:clamp(4rem,14vw,8rem); color:var(--green); text-shadow:0 0 40px rgba(57,255,136,0.4); line-height:1; }
  .mono{ font-family:"JetBrains Mono",monospace; color:var(--text-low); font-size:.95rem; margin:1rem 0 2rem; }
  a{
    font-family:"JetBrains Mono",monospace; color:#04140c; background:linear-gradient(135deg,var(--green),#1fd670);
    padding:.85rem 1.6rem; border-radius:10px; text-decoration:none; font-weight:700; font-size:.85rem;
  }
  .prompt{ color:var(--cyan); }
</style>
</head>
<body>
  <div class="code">404</div>
  <p class="mono"><span class="prompt">hadi@x-hacker:~$</span> curl this-page — <strong style="color:#ff4d6d;">connection refused: route not found</strong></p>
  <a href="/">Return to home</a>
</body>
</html>
